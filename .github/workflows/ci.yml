name: M2-A deterministic checks

on:
  push:
    branches: [feat/m2-a-foundation-fixture-oracle]
  pull_request:
    branches: [research/milestone-1-experiment-plan-2026-11-12]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:types
      - run: pnpm run test
